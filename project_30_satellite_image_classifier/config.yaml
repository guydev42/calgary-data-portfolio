project:
  number: 30
  title: "Satellite Image Classifier"
  version: "1.0.0"

data:
  source: "Open Data Areas Alberta (ODAA)"
  provider: "Maxar / DigitalGlobe via Altalis Ltd."
  tile_size: 256
  bands: ["red", "green", "blue", "nir"]
  classes:
    - "urban"
    - "forest"
    - "agriculture"
    - "water"
    - "barren"
    - "wetland"

model:
  architecture: "resnet50"
  pretrained: true
  num_classes: 6
  learning_rate: 0.0001
  epochs: 30
  batch_size: 32
  scheduler: "cosine_annealing"
  random_state: 42

app:
  title: "Satellite Image Classifier"
  port: 8504
